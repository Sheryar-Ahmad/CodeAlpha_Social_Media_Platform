# Free services only. Photos use Cloudinary; mail uses Brevo's HTTPS API.
# The service sleeps when idle; durable jobs resume when it wakes.
services:
  - type: web
    name: forma
    runtime: node
    plan: free
    region: singapore
    autoDeployTrigger: 'off'
    buildCommand: npm ci --include=dev --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      - key: APP_ORIGIN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MEDIA_STORE
        value: cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: TRUST_PROXY_HOPS
        value: '1'
      - key: SEED_STARTER_CONTENT
        value: 'false'
      - key: REQUIRE_VERIFIED_EMAIL
        value: 'true'
      - key: MAIL_MODE
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
